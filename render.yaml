# Render Blueprint specification for AgriVision AI
# Automatically provisions Backend, ML Engine, and Static Frontend

services:
  # -------------------------------------------------------------
  # 1. Django REST Backend API
  # -------------------------------------------------------------
  - type: web
    name: agrivision-backend
    runtime: python
    plan: free
    region: oregon
    branch: integration
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py seed_demo_data && python manage.py collectstatic --noinput"
    startCommand: "gunicorn agrivision.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: ML_API_URL
        fromService:
          type: web
          name: agrivision-ml
          property: host

  # -------------------------------------------------------------
  # 2. Flask ML Inference Microservice  (Price + CNN Crop Model)
  # -------------------------------------------------------------
  - type: web
    name: agrivision-ml
    runtime: python
    plan: free
    region: oregon
    branch: integration
    rootDir: agrivision-ml
    # Build: install deps (torch CPU-only wheel) then unzip the CNN checkpoint
    buildCommand: >
      pip install --no-cache-dir -r requirements.txt
      --extra-index-url https://download.pytorch.org/whl/cpu
      && python - << 'EOF'
      import zipfile, os, shutil
      src = "models/crop_disease_model.pth"
      if os.path.exists(src):
          print("CNN model file already present, skipping extraction.")
      else:
          for f in ["models/crop_disease_model.pth.zip"]:
              if os.path.exists(f):
                  with zipfile.ZipFile(f) as z: z.extractall("models/")
                  print("Extracted", f)
                  break
      EOF
    # Single gunicorn worker saves RAM on Render free tier; 300s timeout for CNN warmup
    startCommand: "gunicorn src.api:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # -------------------------------------------------------------
  # 3. Static Web Frontend
  # -------------------------------------------------------------
  - type: web
    name: agrivision-ui
    runtime: static
    branch: integration
    buildCommand: ""
    staticPublishPath: .
